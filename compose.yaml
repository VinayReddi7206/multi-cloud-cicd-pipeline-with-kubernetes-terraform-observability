services:
  app:
    build: .
    image: multicloud-demo:local
    ports: ["127.0.0.1:8080:8080"]
    environment:
      APP_ENV: dev
      CLOUD_PROVIDER: local
      APP_VERSION: local
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/local/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [app]
  grafana:
    image: grafana/grafana:13.2.1
    profiles: [monitoring]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/local/datasource.yaml:/etc/grafana/provisioning/datasources/default.yaml:ro
      - ./monitoring/local/dashboards.yaml:/etc/grafana/provisioning/dashboards/default.yaml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
volumes:
  prometheus-data:
  grafana-data:
