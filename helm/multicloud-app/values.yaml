replicaCount: 2
image:
  repository: multicloud-demo
  tag: local
  digest: ""
  pullPolicy: IfNotPresent
environment: dev
cloud: local
service:
  port: 80
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
serviceMonitor:
  enabled: false
  release: monitoring
podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
  # Application callers and Prometheus must use one of these namespaces.
  ingressNamespaces:
    - ingress-nginx
    - monitoring
